# Запуск: docker compose up -d --build   (параметры — в файле .env, образец .env.example)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dating
      POSTGRES_USER: dating
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro   # создает базу dating_test для тестов
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dating -d dating"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        FARO_URL: ${FARO_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/dating
      DB_USER: dating
      DB_PASSWORD: ${DB_PASSWORD}
      BOT_TOKEN: ${BOT_TOKEN:?задайте BOT_TOKEN в .env}
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env (не менее 32 символов)}
      WEB_APP_URL: https://${DOMAIN:?задайте DOMAIN в .env}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
    volumes:
      - photos:/data/photos
    # наружу порт не публикуется: доступ только через Cloudflare Tunnel

  # Исходящее соединение с Cloudflare: HTTPS и сертификат на стороне Cloudflare,
  # входящие порты на сервере не нужны. Маршрут DOMAIN -> http://app:8080 задается в панели Cloudflare.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    depends_on:
      - app
    # HTTP/2 по TCP: соединение QUIC (UDP) часто обрывалось по таймауту
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?задайте CLOUDFLARE_TUNNEL_TOKEN в .env}

  # Отправка логов контейнеров в Grafana Cloud; при деплое включается, если задан GRAFANA_LOKI_TOKEN.
  # Сокет Docker нужен для чтения логов и дает широкие права, поэтому образ зафиксирован и порты не открыты.
  alloy:
    image: grafana/alloy:v1.21.3
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-}
      GRAFANA_LOKI_TOKEN: ${GRAFANA_LOKI_TOKEN:-}
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

  # Тесты сервера (47 шт.) на той же PostgreSQL: docker compose --profile tests run --rm tests
  tests:
    image: maven:3.9-eclipse-temurin-25
    profiles: ["tests"]
    depends_on:
      db:
        condition: service_healthy
    working_dir: /src
    volumes:
      - ./backend:/src
      - maven-cache:/root/.m2
    environment:
      TEST_DB_URL: jdbc:postgresql://db:5432/dating_test
      TEST_DB_PASSWORD: ${DB_PASSWORD}
    command: ["mvn", "-B", "test"]

volumes:
  maven-cache:
  alloy-data:
  db-data:
  photos:
