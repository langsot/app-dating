# Деплой через self-hosted runner на сервере после успешного CI на main (или вручную из main).
# Секреты и переменные окружения production — см. DOCKER.md, раздел «Автодеплой из GitHub Actions».
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Деплой на сервер
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, windows, app-dating]
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    defaults:
      run:
        # Windows may forbid running scripts by ExecutionPolicy. The script is read as ANSI: keep its text in Latin
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    env:
      COMPOSE_PROJECT_NAME: app-dating
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - name: Проверка настроек
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          $missing = 'DOMAIN', 'CLOUDFLARE_TUNNEL_TOKEN', 'BOT_TOKEN', 'JWT_SECRET', 'DB_PASSWORD' |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
            Write-Output "::error::Missing in production environment: $missing"
            exit 1
          }
          if ($env:JWT_SECRET.Length -lt 32) {
            Write-Output "::error::JWT_SECRET is shorter than 32 characters"
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Перезапуск контейнеров
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FARO_URL: ${{ vars.FARO_URL }}
          GRAFANA_LOKI_URL: ${{ vars.GRAFANA_LOKI_URL }}
          GRAFANA_LOKI_USER: ${{ vars.GRAFANA_LOKI_USER }}
          GRAFANA_LOKI_TOKEN: ${{ secrets.GRAFANA_LOKI_TOKEN }}
        run: |
          # Log shipping starts only when Grafana Cloud is configured
          if ($env:GRAFANA_LOKI_TOKEN) { $env:COMPOSE_PROFILES = 'monitoring' }
          # Secrets come from the process environment: no .env file is written to disk
          docker compose up -d --build --remove-orphans
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          docker image prune -f

      - name: Проверка доступности
        run: |
          # A response alone is not enough: another server may answer, so the tunnel is checked too
          foreach ($attempt in 1..30) {
            $state = docker inspect -f '{{.State.Status}}' app-dating-tunnel-1
            $route = cmd /c "docker logs app-dating-tunnel-1 2>&1" |
              Select-String -SimpleMatch 'Updated to new configuration' |
              Select-String -SimpleMatch $env:DOMAIN
            if ($state -eq 'running' -and $route) {
              try {
                Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 -Uri "https://$env:DOMAIN/api/interests" | Out-Null
                Write-Output "App is up: https://$env:DOMAIN"
                exit 0
              } catch {
                Write-Output "Attempt ${attempt}: $($_.Exception.Message)"
              }
            }
            Start-Sleep -Seconds 10
          }
          Write-Output "::error::https://$env:DOMAIN is not reachable through the tunnel after deploy"
          docker ps -a --filter name=app-dating
          cmd /c "docker logs --tail 20 app-dating-tunnel-1 2>&1"
          cmd /c "docker logs --tail 50 app-dating-app-1 2>&1"
          exit 1
